name: CI/CD Masterclass
run-name: ${{ github.actor }} is running the pipeline
on: [push]
jobs: 
    build:
        runs-on: ubuntu-latest
        steps:
            - run: echo "Starting Pipeline"
            - name: Check out repository code
              uses: actions/checkout@v6
            - name: Install Node
              uses: actions/setup-node@v4
            - name: Install dependencies
              run: npm install
            - name: Build Slidedeck
              run: npm run build
            - name: Build Artifact
              uses: actions/upload-pages-artifact@v5
              with: 
                path: dist/

    deploy:
        needs: build

        permissions:
            pages: write
            id-token: write
            contents: read

        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}    

        runs-on: ubuntu-latest
        steps:          
            - name: Deploy
              id: deployment
              uses: actions/deploy-pages@v3