name: CI/CD Masterclass
run-name: ${{ github.actor }} is running the pipeline
on: 
  push:
    branches:
            - main
  workflow_dispatch:
    inputs:
        logLevel:
            description: "Logging Error"
            type: choice
            options: [error, warning]
            required: true

jobs: 
    markdown-lint:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@vd23441a48e516b6c34aea4fa41551a30e30af803
            - uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff
              with:
                globs: '**/*.md'
                # config: markdownlint-config.json
              continue-on-error: true

    build:
        needs: markdown-lint
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
            - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
              with:
                node-version: 20
                cache: 'npm'
            - run: npm ci
            - run: npm run build -- --base /${{ github.event.repository.name}}/ 
            - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
              with: 
                path: dist/

    deploy:
        needs: build

        permissions:
            pages: write 
            id-token: write
            contents: read   

        environment:
            name: github-pages
            url: ${{ steps.deploy.outputs.page_url }}    

        runs-on: ubuntu-latest
        steps:          
            - name: Deploy
              id: deploy
              uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e